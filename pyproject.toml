[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plagascan"
version = "0.4.2"
description = "Read-only Linux hardening auditor: SSH, SUID/sudo/capabilities (GTFOBins), anonymous/guest services, secrets, cron, kernel and CVEs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "DrPlaga" }]
keywords = ["security", "hardening", "linux", "audit", "gtfobins", "privilege-escalation", "misconfiguration", "cis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Environment :: Console",
]

[project.scripts]
plagascan = "plagascan.cli:main"

[tool.setuptools.packages.find]
include = ["plagascan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
